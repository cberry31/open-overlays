<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="col-box left">
            <div class="timing">
                <div class="lap-timing">
                    <div class="data-block">LAPS</div>
                    <div class="data-block">TIME</div>
                </div>
                <div class="data-block">POSISTION</div>
                <div class="data-block">GAP AHEAD</div>
                <div class="data-block">GAP BEHIND</div>
            </div>
            <div class="two-by-two"> 
                <div class="data-block">TC</div>
                <div class="data-block">ABS</div>
                <div class="data-block">BB</div>
                <div class="data-block">MAP</div>
            </div>
        </div>
        <div class="col-box center">
            <div class="data-block">RPM</div>
            <div class="data-block">GEAR</div>
            <div class="data-block">MPH</div>
        </div>
        <div class="col-box right">
            <div class="data-block temps">
                <div class="data-block top-temps">
                    <div>TRACK TEMP</div>
                    <div>TIME</div>
                    <div>AIR TEMP</div>
                </div>
                <div class="data-block mid-temp">
                    <div>OIL TEMP</div>
                    <div>WATER TEMP</div>
                </div>
                <div class="data-block two-by-two">
                    <div>LF</div>
                    <div>RF</div>
                    <div>LR</div>
                    <div>RR</div>
                </div>
            </div>
            <div class="data-block">TIMING</div>
            <div class="data-block fuel">
                <div class="data-block">FUEL REMAINING</div>
                <div class="data-block">FPL</div>
                <div class="data-block">LAPS REMAINING</div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
